[pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -m "not slow and not external" --strict-markers -p no:cacheprovider
markers =
    unit: fast tests without database or network dependencies
    integration: tests that require SEASONA_TEST_DATABASE_URL and PostgreSQL
    api: FastAPI route and dependency tests
    slow: expensive concurrency or full-flow tests
    external: tests that call external services
