name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3-bookworm
        env:
          POSTGRES_DB: seasona_test
          POSTGRES_USER: seasona_user
          POSTGRES_PASSWORD: seasona_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seasona_user -d seasona_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SEASONA_ENVIRONMENT: test
      SEASONA_JWT_SECRET_KEY: test-secret-key
      SEASONA_TEST_DATABASE_URL: postgresql+psycopg://seasona_user:seasona_password@localhost:5432/seasona_test
      SEASONA_ARGON2_TIME_COST: "1"
      SEASONA_ARGON2_MEMORY_COST: "8192"
      SEASONA_ARGON2_PARALLELISM: "1"
      SEASONA_REDIS_URL: ""
      SEASONA_MEILISEARCH_URL: ""
      SEASONA_MEILISEARCH_API_KEY: ""
      SEASONA_MEDIA_ROOT: test/media
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install backend test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall app main.py test

      - name: Check installed packages
        run: python -m pip check

      - name: Run backend tests with coverage
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: error

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/vite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/vite/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t seasona-ci .
